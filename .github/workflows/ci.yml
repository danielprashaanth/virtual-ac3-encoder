name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Pushes to main don't run CI here — the Release workflow builds + tests main on merge.

jobs:
  engine:
    name: Engine build + unit tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # FFmpeg shared dev libs are not committed; cache them across runs.
      - name: Cache FFmpeg dev libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure (CMake, VS 2022 x64)
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build engine/build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Package engine and FFmpeg DLLs
        shell: pwsh
        run: |
          $package = "engine-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $exe = "engine/build/Release/engine.exe"
          if (!(Test-Path $exe)) {
            throw "Built engine.exe not found at $exe"
          }

          Copy-Item $exe $package
          Get-ChildItem $package -Filter "*.dll" | Remove-Item -Force
          Copy-Item "engine/build/Release/*.dll" $package -ErrorAction Stop

          if (!(Test-Path "$package/avcodec-62.dll")) {
            Write-Host "Checking staged FFmpeg DLLs:"
            Get-ChildItem $package -Filter "*.dll" | Select-Object -ExpandProperty Name
          }

          Compress-Archive -Path "$package/*" -DestinationPath "virtual-ac3-encoder-test.zip" -Force

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ac3-encoder-test-windows-x64
          path: virtual-ac3-encoder-test.zip
          if-no-files-found: error
          retention-days: 7